name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m compileall -q src
      - run: python -m json.tool registries/core.json >/dev/null
      - run: python -m json.tool docs/esn-1.schema.json >/dev/null
      - run: python -m json.tool examples/first-score.esn.json >/dev/null
      - run: python -m unittest discover -s tests -v
      - run: esn validate examples/first-score.esn.json --registry registries/core.json
      - run: esn render examples/first-score.esn.json --registry registries/core.json -o /tmp/first-a.svg
      - run: esn render examples/first-score.esn.json --registry registries/core.json -o /tmp/first-b.svg
      - run: cmp /tmp/first-a.svg /tmp/first-b.svg
